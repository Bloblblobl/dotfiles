# ~/.tmux.conf — tmux defaults (WSL clipboard bindings)

# Ctrl-a prefix; press twice to send Ctrl-a to the shell.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
setw -g mode-keys vi
setw -g aggressive-resize on
setw -g monitor-activity on
set -g visual-activity off

# Forward modified keys on application request.
# CSI-u output is omitted: it needs tmux 3.5+ and a compatible outer terminal.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# OSC 52 permits clipboard writes, not reads, from pane applications.
set -g set-clipboard on

# WSL clip.exe may mangle non-ASCII text. OSC 52 is an alternative for emitting
# applications, not an automatic fallback for these copy-mode bindings.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Splits retain the active pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Native tmux provides top edges and shared borders, not independent pane boxes.
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-style "fg=colour238,bg=colour238"
set -g pane-active-border-style "fg=colour25,bg=colour25"
# Separate number/title colours form nested pills.
set -g pane-border-format '#[fg=#{?pane_active,colour31,colour241},bg=#{?pane_active,colour25,colour238}]#[fg=colour255,bg=#{?pane_active,colour31,colour241}]#{?pane_active,#[bold],#[nobold]}#{pane_index}#[fg=#{?pane_active,colour31,colour241},bg=#{?pane_active,colour39,colour246}]#[fg=colour16,bg=#{?pane_active,colour39,colour246}]#{?pane_active,#[bold],#[nobold]} #{pane_current_command}#[fg=#{?pane_active,colour39,colour246},bg=#{?pane_active,colour25,colour238}]'

# Keep focus visible below the pane title.
set -g window-style "fg=colour255,bg=colour232"
set -g window-active-style "fg=colour255,bg=colour234"

# Prefix mode changes the status palette and icon.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#{?client_prefix,colour215,colour238},fg=#{?client_prefix,colour16,colour255}'
set -g status-left-length 40
set -g status-right-length 120
set -g status-left '#[fg=colour255,bg=#{?client_prefix,colour202,colour25},bold] #{?client_prefix,󰫢,󰆍} #S #[fg=#{?client_prefix,colour202,colour25},bg=#{?client_prefix,colour215,colour238},nobold] '
# Render $HOME as ~.
set -g status-right '#[fg=#{?client_prefix,colour208,colour31},bg=#{?client_prefix,colour215,colour238}]#[fg=#{?client_prefix,colour16,colour255},bg=#{?client_prefix,colour208,colour31}] 󰉖 #{s|#{HOME}|~|:pane_current_path} #[fg=#{?client_prefix,colour202,colour25},bg=#{?client_prefix,colour208,colour31}]#[fg=colour255,bg=#{?client_prefix,colour202,colour25},bold] 󰁙 %H:%M'

# Separate simultaneous Nerd Font state glyphs with one cell.
set -g window-status-separator ' '
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-activity-style default
set -g window-status-bell-style default
set -g window-status-format '#[fg=colour241,bg=#{?client_prefix,colour215,colour238}]#[fg=colour255,bg=colour241]#I#[fg=colour241,bg=colour246]#[fg=colour16,bg=colour246] #W#{?window_activity_flag, #[fg=colour84]#[bold]󰧟,}#{?window_bell_flag, #[fg=colour226]#[bold]󰂜,}#{?window_zoomed_flag, #[fg=colour8]#[bold]󰖯,}#[fg=colour246,bg=#{?client_prefix,colour215,colour238},nobold]'
set -g window-status-current-format '#[fg=colour31,bg=#{?client_prefix,colour215,colour238}]#[fg=colour255,bg=colour31,bold]#I#[fg=colour31,bg=colour39]#[fg=colour16,bg=colour39,bold] #W#{?window_activity_flag, #[fg=colour84]#[bold]󰧟,}#{?window_bell_flag, #[fg=colour226]#[bold]󰂜,}#{?window_zoomed_flag, #[fg=colour8]#[bold]󰖯,}#[fg=colour39,bg=#{?client_prefix,colour215,colour238},nobold]'
